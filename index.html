<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Zoo Exhibit Maps</title>

        <style>
           /* Style the main header container */
            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 20px 50px;
                background-color: #333;
                color: white;
            }

            /* Style the logo text */
            .logo {
                font-size: 24px;
                font-weight: bold;
            }

            /* Make the list items sit side-by-side */
            nav ul {
                display: flex;
                list-style: none;
                gap: 20px;
            }

            /* Style the links and remove underlines */
            nav a {
                color: white;
                text-decoration: none;
                font-size: 18px;
            }

            /* Change link color when hovering with a mouse */
            nav a:hover {
                color: #ffcc00;
            }

        </style>
    </head>

    <body>
        <header>
        <!-- Your website logo or brand name -->
        <div class="logo">Animal Map Zoo</div>
        
        <!-- Nate this is the header, the first context of the website -->
        <nav>
            <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
            </ul>
        </nav>
        </header>

    </body>
</html>
